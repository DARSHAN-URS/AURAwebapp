name: Healthcare AI Suite — CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend CI ───────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import validation — verify all product routers load
        run: |
          python -c "
          from app.main import app
          routes = [r.path for r in app.routes if hasattr(r, 'path')]
          print(f'Registered routes: {len(app.routes)}')
          print('Backend product routers loaded successfully')
          "
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          APP_ENV: "development"

  # ─── Aura Routes Frontend CI ──────────────────────────────────────────────────
  aura-routes-ci:
    name: Aura Routes (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/aura-routes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/aura-routes/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://api.auraroutes.com"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # ─── NursePass Frontend CI ────────────────────────────────────────────────────
  nursepass-ci:
    name: NursePass (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nursepass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/nursepass/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://api.nursepass.com"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # ─── Summary ──────────────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-ci, aura-routes-ci, nursepass-ci]
    if: always()
    steps:
      - name: Report CI status
        run: |
          echo "=== Healthcare AI Suite CI Summary ==="
          echo "Backend:      ${{ needs.backend-ci.result }}"
          echo "Aura Routes:  ${{ needs.aura-routes-ci.result }}"
          echo "NursePass:    ${{ needs.nursepass-ci.result }}"
