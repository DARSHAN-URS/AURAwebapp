version: '3.9'

services:
  # ── Shared PostgreSQL Database ────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: healthcare_suite_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthcare_ai_suite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: healthcare_suite_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Shared FastAPI Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
    container_name: healthcare_suite_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/healthcare_ai_suite
      - REDIS_URL=redis://redis:6379
      - APP_ENV=development
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:3002
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  # ── Aura Routes Frontend ──────────────────────────────────────────────────────
  aura-routes:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.aura
    container_name: aura_routes_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

  # ── NursePass Frontend ────────────────────────────────────────────────────────
  nursepass:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.nursepass
    container_name: nursepass_frontend
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: healthcare_suite_nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - aura-routes
      - nursepass

volumes:
  pgdata:
