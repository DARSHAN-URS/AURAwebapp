upstream backend {
    server backend:8000;
}

upstream aura_routes {
    server aura-routes:3000;
}

upstream nursepass {
    server nursepass:3001;
}

# API — Shared backend (all products)
server {
    listen 80;
    server_name api.healthcare-suite.com api.auraroutes.com api.nursepass.com localhost;

    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CORS handled by FastAPI middleware
    }
}

# Aura Routes — Study abroad portal
server {
    listen 80;
    server_name aura.healthcare-suite.com auraroutes.com www.auraroutes.com;

    location / {
        proxy_pass http://aura_routes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# NursePass — Nursing exam prep
server {
    listen 80;
    server_name nursepass.healthcare-suite.com nursepass.com www.nursepass.com;

    location / {
        proxy_pass http://nursepass;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
